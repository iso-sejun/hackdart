name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Run the same steps in both sub‑folders
        folder: [frontend, api]

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # LTS as of 2026

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('${{ matrix.folder }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run lint (frontend only)
        if: matrix.folder == 'frontend'
        run: npm run lint || true   # ignore lint failures for now

      - name: Build (frontend)
        if: matrix.folder == 'frontend'
        run: npm run build

      - name: Run a quick sanity test (api)
        if: matrix.folder == 'api'
        run: node server.js & sleep 5 && curl -f http://localhost:4000/api/v1/health || exit 1
